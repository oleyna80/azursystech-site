services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: azursystech-web:local
    container_name: azursystech-app-local
    environment:
      HOSTNAME: 0.0.0.0
      HOST: 0.0.0.0
      PORT: 3000
    ports:
      - "${APP_PORT:-8081}:3000"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://127.0.0.1:3000/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    deploy:
      resources:
        limits:
          memory: 512M
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
