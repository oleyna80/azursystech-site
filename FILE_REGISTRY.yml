# Machine-readable navigation registry for authority-bearing files and major zones.
# Runtime implementation surfaces are conditional on .agent/bootstrap-profile.json.

version: 9
scope: azursystech
project:
  name: "AzurSysTech"
  slug: "azursystech"
  root: "."

installation_profile:
  state_file: .agent/bootstrap-profile.json
  semantics: installation_composition_only
  authority: none
  health_check: scripts/bootstrap.sh
  validator: scripts/validate-installation-profile.py
  rules:
    - selected_component_paths_must_exist_in_fresh_scaffold
    - required_paths_must_match_expected_filesystem_kind
    - known_unselected_component_paths_must_be_absent_in_fresh_scaffold
    - blocked_default_work_block_must_validate_before_restore
    - evaluation_contract_is_available_in_every_profile
    - define_quality_contract_is_available_in_every_profile
    - installation_does_not_grant_work_block_authority
    - integration_activation_requires_separate_admission

statuses:
  normative: "governance, product, architecture, or policy source of truth"
  derived: "artifact derived from approved normative intent"
  evidence: "requirements-quality, critic, review, verification, evaluation, drift, integration, or closeout evidence"
  runtime_adapter: "runtime-specific execution configuration or guidance"
  integration_adapter: "optional plugin, MCP, external runtime, tool, or transport"
  durable_reference: "evidence-backed rationale and lessons; not an authority source"
  operational_log: "current or historical execution state; not normative"
  generated: "tool-generated artifact; verify against current source"
  conditional_generated: "installed only when selected by bootstrap profile"
  local_state: "machine-local, private, credential, cache, or runtime state"
  source: "project implementation or tests"

authority_order:
  product_and_delivery:
    - explicit_owner_instruction_or_approved_change_request
    - approved_specification
    - accepted_architecture_decisions_and_external_contracts
    - approved_implementation_and_evaluation_plans
    - active_tasklist
    - requirements_quality_review_and_define_consistency_evidence
    - review_verification_evaluation_drift_and_closeout_reports
    - runtime_integration_operational_logs
    - generated_and_external_reference_artifacts
  agent_behavior:
    - explicit_owner_instruction
    - AGENTS.md
    - governance_core
    - active_work_block_scope_write_set_and_assurance_state
    - canonical_sdlc_protocol
    - installed_runtime_adapters
    - admitted_integration_adapters
    - operational_logs_and_generated_artifacts

define_quality:
  contract: governance/define-quality.md
  requirements_review_directory: docs/reports/requirements/**
  requirements_review_template: docs/templates/requirements-quality-review-template.md
  traceable_tasklist_template: docs/templates/traceable-tasklist-template.md
  validator: scripts/validate-define-traceability.py
  evidence_boundary: requirements_and_cross_artifact_structure_only
  source_write_authority: none
  authority: none

evaluation_assurance:
  contract: governance/evaluation.md
  plan_directory: docs/evals/**
  report_directory: docs/reports/evaluations/**
  validator: scripts/validate-evaluation.py
  templates:
    - docs/templates/evaluation-plan-template.json
    - docs/templates/evaluation-report-template.json
    - docs/templates/trajectory-event-template.json
  evidence_boundary: observable_events_only
  hidden_reasoning_required: false
  authority: none

repair_assurance:
  mode: controlled_ndr_only
  repair_record_template: docs/templates/repair-record-template.md
  combined_assurance_template: docs/templates/combined-assurance-report-template.md
  validator: scripts/repair-lifecycle.py
  limits: {implementation_passes: 1, ndr_corrections: 1, stabilization_items: 3, stabilization_corrections: 2}
  authority: none

process_feedback:
  sink: docs/engineering-memory/process-feedback-registry.yml
  schema: scripts/process_feedback.py
  validator: scripts/validate-process-feedback.py
  aggregator: scripts/aggregate-process-feedback.py
  authority: advisory_only
  systemic_change_requires: separate_improvement_work_block
  direct_governance_mutation: forbidden

migration_state:
  completed_work_blocks:
    - docs/plans/WB-2026-08-25-shared-analysis-surface.md
    - docs/plans/WB-2026-08-28-repository-lifecycle-normalization.md
    - docs/plans/WB-2026-08-29-repository-closeout-cleanup.md
    - docs/plans/WB-2026-09-03-lifecycle-inactive-publication-reconciliation.md
    - docs/plans/WB-2026-09-03-lifecycle-inactive-publication-commit-reconciliation.md
    - docs/plans/WB-2026-09-03-lifecycle-inactive-closeout-coordination-reconciliation.md
    - docs/plans/WB-2026-09-03-lifecycle-inactive-commit-bypass-correction.md
    - docs/plans/WB-2026-09-03-technical-seo-cwv-entity-audit.md
    - docs/plans/WB-2026-09-08-active-work-block-state-recovery.md
    - docs/plans/WB-2026-09-09-crawl-indexation-reconciliation.md
    - docs/plans/WB-2026-09-09-release-state-fixture-isolation.md
    - docs/plans/WB-2026-09-09-lifecycle-ownership-reconciliation.md
    - docs/plans/WB-2026-09-09-process-feedback-self-improvement.md
    - docs/plans/WB-2026-09-11-control-plane-recovery-hardening-027.md
  active_work_block: docs/plans/WB-036.md

release_state:
  contract: governance/release-state.md
  validator: scripts/validate-release-state.py
  fixtures: scripts/test-release-state-contracts.py
  workflow: .github/workflows/release-state-contract.yml
  authority: assurance_only
  external_vcs_state: non_normative
  latest_completed_work_block: docs/plans/WB-2026-09-11-control-plane-recovery-hardening-027.md
  closeout_report: docs/reports/closeout/WB-2026-09-11-control-plane-recovery-hardening-027.md

entries:
  AGENTS.md:
    role: project_operating_contract
    status: normative
    owner: owner
    related: [governance/README.md, .agent/workflows/sdd-protocol.md, .agent/ROSTER.md]

  PROJECT_MAP.md:
    role: human_readable_project_map
    status: normative
    owner: architect

  docs/project-context.md:
    role: compact_shared_project_context
    status: durable_reference
    owner: architect

  memory_bank/orchestrator-log.md:
    role: shared_operational_log
    status: operational_log
    owner: orchestrator

  memory_bank/context.md:
    role: shared_operational_context
    status: operational_log
    owner: orchestrator

  memory_bank/progress.md:
    role: shared_operational_progress
    status: operational_log
    owner: orchestrator

  memory_bank/decisions.md:
    role: shared_operational_decisions
    status: operational_log
    owner: orchestrator

  scripts/validate-shared-context.py:
    role: shared_context_boundary_validator
    status: source
    owner: tooling

  FILE_REGISTRY.yml:
    role: machine_readable_navigation_registry
    status: normative
    owner: architect

  .agent/bootstrap-profile.json:
    role: resolved_installation_profile_components_skills_and_path_contract
    status: generated
    owner: tooling
    authority: none

  governance/**:
    role: runtime_neutral_governance_core
    status: normative
    owner: architect
    availability: always

  governance/define-quality.md:
    role: define_stage_clarification_requirements_quality_traceability_and_consistency_contract
    status: normative
    owner: architect
    authority: define_quality_only_no_source_write_authority

  governance/enforcement.md:
    role: runtime_neutral_hook_enforcement_reversibility_and_poka_yoke_policy
    status: normative
    owner: architect
    authority: none

  governance/decision-provenance.md:
    role: provenance_contract_for_reusable_sdlc_mechanisms
    status: normative
    owner: architect

  governance/release-state.md:
    role: repository_ssot_reconciliation_and_release_state_boundary
    status: normative
    owner: architect

  governance/runtime-capabilities.md:
    role: runtime_capabilities_negotiation_and_isolation_tiers
    status: normative
    owner: architect

  governance/evaluation.md:
    role: deterministic_output_and_observable_trajectory_evaluation_contract
    status: normative
    owner: architect
    authority: assurance_only

  .agent/ROSTER.md:
    role: logical_role_and_skill_router
    status: normative
    owner: architect

  .agent/workflows/sdd-protocol.md:
    role: canonical_define_execute_assure_close_contract
    status: normative
    owner: architect

  .agent/workflows/owner-controlled-github-flow.md:
    role: subject_branch_candidate_publication_operational_workflow
    status: derived
    owner: architect

  .agent/active-work-block.json:
    role: operational_gate_state
    status: derived
    owner: orchestrator

  .agent/active-work-block.default.json:
    role: portable_fail_closed_default_gate_state
    status: normative
    owner: architect

  docs/session-bootstrap.md:
    role: new_session_intake_guidance
    status: normative
    owner: architect

  docs/specs/**:
    role: approved_specifications
    status: normative
    owner: architect

  docs/architecture/**:
    role: architecture_decision_records
    status: normative
    owner: architect

  docs/plans/**:
    role: work_block_plans
    status: evidence
    owner: orchestrator

  docs/tasklist/**:
    role: task_decomposition_and_tracking
    status: derived
    owner: orchestrator

  docs/reports/**:
    role: assurance_critic_review_verification_and_closeout_reports
    status: evidence
    owner: verifier

  docs/evals/**:
    role: evaluation_plans_and_fixtures
    status: evidence
    owner: evaluator

  docs/engineering-memory/**:
    role: durable_engineering_decisions_and_principles
    status: durable_reference
    owner: architect

  docs/engineering-memory/process-feedback-registry.yml:
    role: canonical_structured_process_feedback_sink
    status: durable_reference
    owner: orchestrator
    authority: advisory_only

  docs/templates/**:
    role: reusable_artifact_templates
    status: normative
    owner: architect

  .agent/skills/**:
    role: project_local_skills
    status: normative
    owner: architect

  scripts/validate-define-traceability.py:
    role: define_quality_traceability_validator
    status: source
    owner: tooling

  scripts/validate-release-state.py:
    role: release_state_reconciliation_validator
    status: source
    owner: tooling

  scripts/validate-installation-profile.py:
    role: installation_profile_validator
    status: source
    owner: tooling

  scripts/validate-evaluation.py:
    role: evaluation_contract_validator
    status: source
    owner: tooling

  scripts/repair-lifecycle.py:
    role: ndr_repair_lifecycle_validator
    status: source
    owner: tooling

  web/**:
    role: production_website_and_intake_app
    status: source
    owner: coder

  admin/**:
    role: internal_operations_admin_app
    status: source
    owner: coder

  showcase/**:
    role: portfolio_showcase_demos_app
    status: source
    owner: coder

  scripts/**:
    role: automation_vps_deploy_and_ci_scripts
    status: source
    owner: coder
