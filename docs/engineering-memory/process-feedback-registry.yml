    likely_systemic_cause: Operational active Work Block state carried rationale and assurance fields without requiring durable repository reports for the final candidate.
    impact: A new Codex or Claude session could not reconstruct why the Work Block exists, what was verified, and what remains deferred from repository artifacts alone.
    suggested_improvement: "Resolved in WB-035 v2 by committing the specification, process feedback, Critic disposition, Reviewer report, and Verifier report with exact candidate references."
