  - id: PF-2026-09-09-subagent-topology-root-inheritance
    work_block_id: WB-2026-09-09-subagent-topology-reconciliation
    date: "2026-09-09"
    category: ENVIRONMENT_ISSUE
    observation: Session-root inheritance prevented the scoped Coder from mutating the intended isolated Work Block worktree during the first execution attempt.
    evidence: "Owner resume evidence and docs/reports/capability/WB-2026-09-09-subagent-topology-reconciliation.md record parent and child execution bound to the canonical checkout; the session-root/write guard correctly blocked mutation and no project files changed."
    likely_systemic_cause: Native child-session launch inherited the canonical checkout root instead of the requested Work Block root.
    impact: The approved implementation was delayed and required a fresh correctly rooted session; bypassing the guard would have violated worktree isolation and was not attempted.
    suggested_improvement: Add a pre-dispatch root assertion and surface the effective child session root before admitting a write-capable Coder; do not weaken the existing guard.
    severity: LOW
    status: NEW
    authority: advisory_only
    avoidable_friction: true
    related_work_blocks: []
  - id: PF-2026-09-12-codex-hook-json-contract-mismatch
    work_block_id: WB-2026-09-11-control-plane-recovery-hardening-027
    date: "2026-09-12"
    category: CONTRACT_MISMATCH
    observation: The active Codex runtime repeatedly rejected lifecycle-hook output from the globally enabled security-guidance plugin during SessionStart, PostToolUse, and Stop.
    evidence: >-
      The runtime reported "hook returned invalid session start JSON output",
      "hook returned invalid post-tool-use JSON output", and "hook returned
      invalid stop hook JSON output". Direct, non-mutating handler probes
      captured PostToolUse stdout containing a top-level metrics object and Stop
      stdout containing top-level metrics and rewakeSummary fields. The
      SessionStart handler source emits an async handshake and a metrics object.
      The installed Codex command-hook schemas use additionalProperties: false
      and do not allow those fields. The historical event payload itself was
      not present in the persisted local session log; the handler source and
      direct outputs are the reproducible evidence.
    likely_systemic_cause: The external security-guidance@claude-plugins-official plugin v2.0.8 is registered for lifecycle phases at the user Codex runtime boundary but emits Claude Code SyncHookJSONOutput and async-protocol fields that are not valid Codex command-hook output.
    impact: The affected plugin events are rejected, so security guidance, metrics, and lifecycle diagnostics from that integration are unreliable; repository-local admission, recovery, and fail-closed semantics are unaffected.
    suggested_improvement: The plugin or runtime integration owner should gate Claude-specific hook registration by runtime or add a Codex serializer that emits only the documented Codex schema, with diagnostics and metrics kept off protocol stdout. Do not weaken normal guards or change global configuration in this Work Block.
    severity: LOW
    status: TRIAGED
    authority: advisory_only
    avoidable_friction: true
    related_work_blocks: []
  - id: PF-2026-09-12-terminal-plan-tasklist-publication-mismatch
    work_block_id: WB-2026-09-11-control-plane-recovery-hardening-027
    date: "2026-09-12"
    category: CONTRACT_MISMATCH
    observation: The terminal publication guard did not admit the lifecycle-required exact Work Block plan and tasklist projection, making an assured terminal candidate unpublishable.
    evidence: "Historical candidate 6e6e3252fc4bbb3c3b23fdcbb81b6e0e069256e6 passed parent/child, assurance, branch, and trailer predicates but terminal_diff_allowed rejected its bound plan/tasklist projection; fresh Critic 01a0965a-820a-7f72-9026-908b502de0e8 identified the gap."
    likely_systemic_cause: The repository terminal path check used only a static coordination allowlist instead of deriving exact plan/tasklist paths from the active parent Work Block identity and lifecycle state.
    impact: A technically assured terminal closeout could not be published, and tasklist closure was not enforced by the publication predicate.
    suggested_improvement: Derive exactly one parent-bound plan and tasklist, require matching Work Block/specification identity and revision, completed closure markers, checked required tasks, and reject all unrelated or extra paths.
    severity: LOW
    status: TRIAGED
    authority: advisory_only
    avoidable_friction: true
    related_work_blocks: []
