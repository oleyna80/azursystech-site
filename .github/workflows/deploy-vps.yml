name: Deploy to VPS

on:
  workflow_run:
    workflows:
      - Docker Publish
    types:
      - completed
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Immutable image tag to deploy (example: sha-<40-char-commit>)"
        required: true
        default: ""

jobs:
  deploy:
    if: |
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'main') ||
      github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Resolve image tag
        id: meta
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_run" ]; then
            IMAGE_TAG="sha-${{ github.event.workflow_run.head_sha }}"
          else
            IMAGE_TAG="${{ github.event.inputs.image_tag }}"
          fi
          if [ -z "$IMAGE_TAG" ]; then
            echo "IMAGE_TAG is required" >&2
            exit 1
          fi
          if [ "$IMAGE_TAG" = "latest" ]; then
            echo "latest is forbidden for deploy source; use immutable sha-* tag" >&2
            exit 1
          fi
          echo "image_tag=$IMAGE_TAG" >> "$GITHUB_OUTPUT"

      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          script_stop: true
          script: |
            set -euo pipefail
            cd "${{ secrets.VPS_APP_DIR }}"
            export IMAGE_REPO="ghcr.io/${{ github.repository }}"
            export IMAGE_TAG="${{ steps.meta.outputs.image_tag }}"

            echo "${{ secrets.GHCR_TOKEN }}" | docker login ghcr.io -u "${{ secrets.GHCR_USERNAME }}" --password-stdin
            docker compose -f docker-compose.vps.yml config > /tmp/azursystech-compose.rendered.yml
            docker compose -f docker-compose.vps.yml pull
            docker compose -f docker-compose.vps.yml up -d --remove-orphans
            docker image prune -f
            docker compose -f docker-compose.vps.yml ps
