name: Control Plane Contracts

on:
  push:
    branches:
      - main
    paths:
      - ".agent/**"
      - ".githooks/**"
      - ".claude/**"
      - ".codex/**"
      - "scripts/sdlc-v1-*.py"
      - "scripts/verify-sdlc-replacement.py"
      - "scripts/bootstrap.sh"
      - ".github/workflows/control-plane-contracts.yml"
  pull_request:
    paths:
      - ".agent/**"
      - ".githooks/**"
      - ".claude/**"
      - ".codex/**"
      - "scripts/sdlc-v1-*.py"
      - "scripts/verify-sdlc-replacement.py"
      - "scripts/bootstrap.sh"
      - ".github/workflows/control-plane-contracts.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  control-plane:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Verify assured SDLC replacement
        run: python scripts/verify-sdlc-replacement.py
