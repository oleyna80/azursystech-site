name: Control Plane Contracts

on:
  push:
    branches:
      - "**"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  control-plane:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Compile migrated Python control plane
        run: |
          python -m py_compile \
            .agent/hooks/hard_stop_policy.py \
            .agent/hooks/git_transition_policy.py \
            .claude/hooks/assurance_gate.py \
            .claude/hooks/work_block_gate.py \
            .codex/hooks/pre_tool_use_policy.py \
            .codex/hooks/subagent_context.py \
            .codex/scripts/doctor.py \
            .codex/scripts/lifecycle.py \
            scripts/validate-evaluation.py \
            scripts/validate-installation-profile.py \
            scripts/test-github-capability-control-plane.py \
            scripts/validate-git-conformance.py \
            scripts/test-git-conformance.py \
            scripts/test-github-capability-github-cli-hard-stops.py \
            scripts/validate-shared-context.py \
            scripts/test-validate-shared-context.py

      - name: Validate schema v3 blocked-default contract only
        run: |
          python - <<'PY'
          import runpy
          from pathlib import Path

          namespace = runpy.run_path("scripts/validate-installation-profile.py")
          namespace["validate_blocked_default"](Path("."))
          print("blocked-default schema v3 contract: OK")
          PY

      - name: Run GitHub capability authority integration fixtures
        run: python scripts/test-github-capability-control-plane.py

      - name: Run published-object conformance fixtures
        run: python scripts/test-git-conformance.py

      - name: Check published subject candidate
        if: github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref_name != github.event.repository.default_branch)
        env:
          SUBJECT_BRANCH: ${{ github.event.pull_request.head.ref || github.ref_name }}
          PUBLISHED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: python scripts/validate-git-conformance.py --branch "$SUBJECT_BRANCH" --head "$PUBLISHED_HEAD" --default-branch "$DEFAULT_BRANCH"

      - name: Run GitHub CLI/API Hard Stop fixtures
        run: python scripts/test-github-capability-github-cli-hard-stops.py

      - name: Run shared-context boundary regression and validation
        run: python scripts/test-validate-shared-context.py && python scripts/validate-shared-context.py

      - name: Run native Codex apply-patch payload fixture
        run: bash .codex/hooks/tests/apply-patch-fixtures.sh

      - name: Run Work Block commit linkage and bootstrap fixtures
        run: bash .githooks/tests/commit-msg-fixtures.sh

      - name: Run sprint-analysis evidence fixtures
        run: bash .agent/skills/sprint-analysis/tests/commit-linkage-fixtures.sh
