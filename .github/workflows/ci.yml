name: CI

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        project:
          - web
          - showcase
          - admin
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: ${{ matrix.project }}/package-lock.json

      - name: Install dependencies
        working-directory: ${{ matrix.project }}
        run: npm ci

      - name: Lint
        working-directory: ${{ matrix.project }}
        run: npm run lint

      - name: Test
        if: ${{ matrix.project == 'web' }}
        working-directory: ${{ matrix.project }}
        run: npm run test:ci

      - name: Type check
        working-directory: ${{ matrix.project }}
        run: npm run check:types

      - name: Runtime dependency audit
        working-directory: ${{ matrix.project }}
        continue-on-error: true
        run: npm audit --omit=dev --audit-level=high

      - name: Build
        if: ${{ matrix.project != 'showcase' }}
        working-directory: ${{ matrix.project }}
        run: npm run build

      - name: Build Showcase with Webpack
        if: ${{ matrix.project == 'showcase' }}
        working-directory: showcase
        run: npx next build --webpack

      - name: Validate Showcase multizone contract
        if: ${{ matrix.project == 'showcase' }}
        run: python3 scripts/test-showcase-multizone.py

  showcase-docker-runtime:
    name: Showcase Docker runtime (PR authoritative)
    if: ${{ github.event_name == 'pull_request' }}
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build Showcase image
        run: docker build --file Dockerfile.showcase --tag azursystech-showcase-ci:${{ github.sha }} .

      - name: Start Showcase container
        run: docker run --detach --name azursystech-showcase-ci --publish 127.0.0.1:3000:3000 azursystech-showcase-ci:${{ github.sha }}

      - name: Verify Showcase health endpoint
        run: curl --fail --show-error --silent --retry 15 --retry-connrefused --retry-delay 1 http://127.0.0.1:3000/demo/health | grep -F '"status":"ok"'

      - name: Remove Showcase container
        if: ${{ always() }}
        run: docker rm --force azursystech-showcase-ci || true
