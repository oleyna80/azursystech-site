name: CI

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        project:
          - web
          - showcase
          - admin
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: ${{ matrix.project }}/package-lock.json

      - name: Install dependencies
        working-directory: ${{ matrix.project }}
        run: npm ci

      - name: Lint
        working-directory: ${{ matrix.project }}
        run: npm run lint

      - name: Test
        if: ${{ matrix.project == 'web' }}
        working-directory: ${{ matrix.project }}
        run: npm run test:ci

      - name: Type check
        working-directory: ${{ matrix.project }}
        run: npm run check:types

      - name: Runtime dependency audit
        working-directory: ${{ matrix.project }}
        run: npm audit --omit=dev --audit-level=high

      - name: Build
        working-directory: ${{ matrix.project }}
        env:
          SHOWCASE_STATIC_EXPORT: ${{ matrix.project == 'showcase' && '1' || '0' }}
        run: npm run build
