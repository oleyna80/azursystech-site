services:
  postgres:
    image: postgres:16-alpine
    container_name: azursystech-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    deploy:
      resources:
        limits:
          memory: 512M
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  app:
    image: ${APP_IMAGE:?APP_IMAGE is required}
    container_name: azursystech-app
    init: true
    environment:
      HOSTNAME: 0.0.0.0
      HOST: 0.0.0.0
      PORT: 3000
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:?DEEPSEEK_API_KEY is required}
      DEEPSEEK_BASE_URL: ${DEEPSEEK_BASE_URL:-https://api.deepseek.com}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-https://azursystech.fr,https://www.azursystech.fr}
      AZURSYSTECH_TRUST_PROXY_HEADERS: ${AZURSYSTECH_TRUST_PROXY_HEADERS:-true}
      META_APP_SECRET: ${META_APP_SECRET:-}
      FACEBOOK_APP_SECRET: ${FACEBOOK_APP_SECRET:-}
      AZURSYSTECH_CONTACT_SUBMIT_ENABLED: ${AZURSYSTECH_CONTACT_SUBMIT_ENABLED:-false}
      AZURSYSTECH_CONTACT_SUBMIT_BASE_URL: ${AZURSYSTECH_CONTACT_SUBMIT_BASE_URL}
      AZURSYSTECH_CONTACT_SUBMIT_ALLOWED_HOSTS: ${AZURSYSTECH_CONTACT_SUBMIT_ALLOWED_HOSTS:-}
      AZURSYSTECH_CONTACT_SUBMIT_TOKEN: ${AZURSYSTECH_CONTACT_SUBMIT_TOKEN}
      AZURSYSTECH_TELEGRAM_NOTIFICATIONS_ENABLED: ${AZURSYSTECH_TELEGRAM_NOTIFICATIONS_ENABLED:-false}
      AZURSYSTECH_TELEGRAM_BOT_TOKEN: ${AZURSYSTECH_TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_WEBHOOK_RECEIVE_ENABLED: ${TELEGRAM_WEBHOOK_RECEIVE_ENABLED:-false}
      TELEGRAM_WEBHOOK_SECRET: ${TELEGRAM_WEBHOOK_SECRET:-}
      AZURSYSTECH_TELEGRAM_CHAT_ID: ${AZURSYSTECH_TELEGRAM_CHAT_ID:-}
      AZURSYSTECH_TELEGRAM_THREAD_ID: ${AZURSYSTECH_TELEGRAM_THREAD_ID:-}
      AZURSYSTECH_TELEGRAM_API_BASE_URL: ${AZURSYSTECH_TELEGRAM_API_BASE_URL:-https://api.telegram.org}
      INTAKE_STORAGE_MODE: ${INTAKE_STORAGE_MODE:-legacy}
      AI_LAUNCH_MODE: ${AI_LAUNCH_MODE:-limited_live_intake}
      AI_ALLOW_AUTONOMOUS_OUTBOUND: ${AI_ALLOW_AUTONOMOUS_OUTBOUND:-false}
      AI_ALLOW_PRICING_COMMITMENTS: ${AI_ALLOW_PRICING_COMMITMENTS:-false}
      AI_ALLOW_SCHEDULING_PROMISES: ${AI_ALLOW_SCHEDULING_PROMISES:-false}
      DATABASE_URL: ${DATABASE_URL}
      DATABASE_SSL_MODE: ${DATABASE_SSL_MODE:-disable}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://$(hostname -i | awk '{print $1}'):3000/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    deploy:
      resources:
        limits:
          memory: 512M
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - default

  admin:
    image: ${ADMIN_IMAGE:-ghcr.io/oleyna80/azursystech-admin:__unset__}
    container_name: azursystech-admin
    init: true
    profiles:
      - admin
    environment:
      HOSTNAME: 0.0.0.0
      HOST: 0.0.0.0
      PORT: 3000
      DATABASE_URL: ${DATABASE_URL}
      DATABASE_SSL_MODE: ${DATABASE_SSL_MODE:-disable}
      ADMIN_AUTH_ENABLED: ${ADMIN_AUTH_ENABLED:-true}
      ADMIN_SESSION_SECRET: ${ADMIN_SESSION_SECRET:?ADMIN_SESSION_SECRET is required}
      ADMIN_PASSWORD_HASH: ${ADMIN_PASSWORD_HASH:?ADMIN_PASSWORD_HASH is required}
      ADMIN_SCHEDULER_SECRET: ${ADMIN_SCHEDULER_SECRET:-}
      ADMIN_SESSION_TTL_SECONDS: ${ADMIN_SESSION_TTL_SECONDS:-28800}
      ADMIN_DB_POOL_MAX: ${ADMIN_DB_POOL_MAX:-2}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://$(hostname -i | awk '{print $1}'):3000/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    deploy:
      resources:
        limits:
          memory: 384M
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - default

  web:
    image: nginx:1.27-alpine
    container_name: azursystech-web
    depends_on:
      app:
        condition: service_healthy
    volumes:
      - ./nginx.proxy.conf:/etc/nginx/nginx.conf:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://127.0.0.1/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 128M
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - default
      - npm_default

networks:
  npm_default:
    external: true

volumes:
  postgres_data:
