worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    server_tokens off;
    client_max_body_size 128k;

    resolver 127.0.0.11 valid=30s ipv6=off;
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;
    set_real_ip_from 127.0.0.1;
    set_real_ip_from 172.18.0.0/16;

    map $host $is_allowed_host {
        default 0;
        azursystech.fr 1;
        www.azursystech.fr 1;
        admin.azursystech.fr 1;
        localhost 1;
        127.0.0.1 1;
    }

    map $host $upstream_service {
        default app:3000;
        admin.azursystech.fr admin:3000;
    }

    map $host $serves_demo_static {
        default 0;
        azursystech.fr 1;
        www.azursystech.fr 1;
        localhost 1;
        127.0.0.1 1;
    }

    map $host $x_frame_options {
        default "SAMEORIGIN";
        admin.azursystech.fr "DENY";
    }

    map $host $content_security_policy {
        default "default-src 'self'; base-uri 'self'; frame-ancestors 'self'; form-action 'self'; object-src 'none'; img-src 'self' data: https:; font-src 'self' data: https:; style-src 'self' 'unsafe-inline' https:; script-src 'self' 'unsafe-inline' https://www.googletagmanager.com https://www.google-analytics.com; connect-src 'self' https://www.google-analytics.com https://region1.google-analytics.com; worker-src 'self' blob:; manifest-src 'self'; media-src 'self' https: data:; upgrade-insecure-requests";
        admin.azursystech.fr "default-src 'self'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'; object-src 'none'; img-src 'self' data:; font-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self'; upgrade-insecure-requests";
    }

    map $realip_remote_addr $is_allowed_proxy {
        default 0;
        127.0.0.1 1;
        ~^172\.18\. 1;
    }

    server {
        listen 80;
        server_name _;

        if ($is_allowed_host = 0) {
            return 444;
        }

        if ($is_allowed_proxy = 0) {
            return 444;
        }

        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "$x_frame_options" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
        add_header X-Permitted-Cross-Domain-Policies "none" always;
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        add_header Cross-Origin-Resource-Policy "same-origin" always;
        add_header Content-Security-Policy "$content_security_policy" always;

        location = /demo {
            if ($serves_demo_static = 0) {
                return 404;
            }

            return 308 /demo/;
        }

        location ^~ /demo-assets/ {
            if ($serves_demo_static = 0) {
                return 404;
            }

            root /usr/share/nginx/html;
            try_files $uri =404;
            expires 1y;
        }

        location ^~ /demo/ {
            if ($serves_demo_static = 0) {
                return 404;
            }

            root /usr/share/nginx/html;
            try_files $uri $uri.html $uri/index.html =404;
        }

        location / {
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header CF-Connecting-IP $remote_addr;
            proxy_pass http://$upstream_service;
        }
    }
}
